[package]
name = "wincleam"
version = "2.0.0"
description = "WinCleam Windows maintenance utility"
authors = ["WinCleam"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
